name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (stable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --locked

  msrv:
    name: test (MSRV 1.87.0)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --locked

  release:
    name: release build
    runs-on: windows-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Verify the binary is self-contained
        shell: pwsh
        run: |
          $exe = 'target/release/peekguard.exe'
          if (-not (Test-Path $exe)) { throw "no exe at $exe" }
          $size = [math]::Round((Get-Item $exe).Length / 1KB)
          Write-Host "peekguard.exe = $size KB"
      - name: Attach the exe
        uses: actions/upload-artifact@v7
        with:
          name: peekguard-windows-x64
          path: target/release/peekguard.exe
          if-no-files-found: error
